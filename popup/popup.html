<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhishArmor</title>
  <link rel="stylesheet" type="text/css" href="popup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
  <div id="logged-out-view" class="popup-container" role="main" aria-labelledby="login-title">
    <!-- Header with Logo -->
    <header class="popup-header">
      <div class="logo-container">
        <img src="../assets/logo1.png" alt="PhishArmor Logo" class="popup-logo" role="img">
      </div>
    </header>
    
    <!-- Main Content -->
    <main class="popup-content">
      <h1 id="login-title" class="popup-title" data-i18n="login.title">PhishArmor Protection</h1>
      <p class="popup-description" data-i18n="login.description">Protect your emails with AI-powered phishing detection.</p>
      
      <!-- Action Buttons -->
      <section class="popup-actions" aria-label="Authentication actions">
        <button 
          id="login-button" 
          class="btn-primary material-button" 
          type="button"
          aria-describedby="login-description"
          data-i18n="login.button"
        >
          <span class="button-text">Login to Continue</span>
          <span class="button-ripple"></span>
        </button>
        <div class="signup-section" role="region" aria-label="Sign up information">
          <span class="signup-text" data-i18n="login.no_account">Don't have an account? </span>
          <a 
            href="#" 
            id="signup-link" 
            class="signup-link" 
            role="link"
            aria-label="Sign up for a new account"
            data-i18n="login.signup"
            tabindex="0"
          >Sign up</a>
        </div>
      </section>
    </main>
  </div>

  <div id="logged-in-view" class="popup-container" style="display: none;" role="main" aria-labelledby="dashboard-title">
    <!-- Header with Logo -->
    <header class="popup-header">
      <div class="logo-container">
        <img src="../assets/logo1.png" alt="PhishArmor Logo" class="popup-logo" role="img">
      </div>
    </header>
    
    <!-- Dashboard Content -->
    <main class="popup-content">
      <h1 id="dashboard-title" class="popup-title" data-i18n="dashboard.title">Dashboard</h1>
      
      <section class="security-summary" aria-labelledby="security-score-label">
        <div class="score-container">
          <div class="score-label" id="security-score-label" data-i18n="dashboard.security_score">Security Score</div>
          <div class="score-value" id="current-score" aria-describedby="score-explanation" role="status">N/A</div>
        </div>
        <p class="score-explanation" id="score-explanation" data-i18n="dashboard.scan_prompt">Scan your latest email to see your score.</p>
      </section>
      
      <section class="stats-container" aria-label="Security statistics">
        <div class="stat-item" role="region" aria-labelledby="blocked-label">
          <div class="stat-value" id="blocked-urls-count" aria-describedby="blocked-label">0</div>
          <div class="stat-label" id="blocked-label" data-i18n="dashboard.urls_blocked">URLs Blocked</div>
        </div>
        <div class="stat-item" role="region" aria-labelledby="scanned-label">
          <div class="stat-value" id="emails-scanned" aria-describedby="scanned-label">0</div>
          <div class="stat-label" id="scanned-label" data-i18n="dashboard.emails_scanned">Emails Scanned</div>
        </div>
      </section>
      
      <section class="popup-actions" aria-label="Dashboard actions">
        <button 
          id="flagged-emails-button" 
          class="btn-secondary material-button" 
          type="button"
          aria-label="View flagged emails"
          data-i18n="dashboard.view_flagged"
        >
          <span class="material-icons" aria-hidden="true">flag</span>
          <span class="button-text">View Flagged Emails</span>
        </button>
        <button 
          id="settings-button" 
          class="btn-secondary material-button" 
          type="button"
          aria-label="Open settings"
          data-i18n="dashboard.settings"
        >
          <span class="material-icons" aria-hidden="true">settings</span>
          <span class="button-text">Settings</span>
        </button>
        <button 
          id="logout-button" 
          class="btn-logout material-button" 
          type="button"
          aria-label="Logout from PhishArmor"
          data-i18n="dashboard.logout"
        >
          <span class="material-icons" aria-hidden="true">logout</span>
          <span class="button-text">Logout</span>
        </button>
      </section>
    </main>
  </div>
  
  <!-- Loading state -->
  <div id="loading-view" class="popup-container loading-container" style="display: none;" role="status" aria-live="polite">
    <div class="loading-content">
      <div class="loading-spinner" aria-hidden="true"></div>
      <p class="loading-text" data-i18n="common.loading">Loading...</p>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
